[package]
name = "florui-assets"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "florui_assets"

[features]
default = ["watch"]
# A background file-watcher thread per watched source -- not every
# consumer wants one (a build script or a one-shot decode never does), so
# this is its own feature rather than unconditionally compiled in. Left
# default-on (a consumer that doesn't want it, like florui-icon, opts out
# with `default-features = false`) so `cargo test --workspace` actually
# exercises the real file-watch invalidation path in CI.
watch = ["dep:notify"]
# Loading `https://` and `http://` sources: an HTTP client with TLS, a disk
# cache and a bounded request queue (see the `net` module). Off by default, so
# an application that never loads from the network links none of it.
net = ["dep:ureq", "dep:url", "dep:httpdate"]

[dependencies]
florui-profile = { path = "../florui-profile" }
resvg = { version = "0.48.1", default-features = false, features = ["raster-images", "text"] }
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "gif",
] }
base64 = "0.22"
notify = { version = "8.2.0", optional = true }
# Blocking, small and pure Rust apart from the crypto of rustls (ring); the
# certificate check goes through the platform verifier (the system store) and
# the proxy settings are read from the environment. See the `net` module.
ureq = { version = "3", optional = true, default-features = false, features = ["rustls", "platform-verifier"] }
url = { version = "2.5.8", optional = true }
httpdate = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"
