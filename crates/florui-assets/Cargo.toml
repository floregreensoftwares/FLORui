[package]
name = "florui-assets"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "florui_assets"

[features]
default = ["watch"]
# A background file-watcher thread per watched source -- not every
# consumer wants one (a build script or a one-shot decode never does), so
# this is its own feature rather than unconditionally compiled in. Left
# default-on (a consumer that doesn't want it, like florui-icon, opts out
# with `default-features = false`) so `cargo test --workspace` actually
# exercises the real file-watch invalidation path in CI.
watch = ["dep:notify"]

[dependencies]
florui-profile = { path = "../florui-profile" }
resvg = { version = "0.48.1", default-features = false }
image = { version = "0.25.10", default-features = false, features = [
    "png",
] }
notify = { version = "8.2.0", optional = true }

[dev-dependencies]
tempfile = "3"
