[package]
license.workspace = true
name = "florui-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "florui"
path = "src/main.rs"

[dependencies]
florui-config = { path = "../florui-config" }
florui-assets = { path = "../florui-assets", default-features = false }
florui-devtools = { path = "../florui-devtools" }
florui-conformance = { path = "../florui-conformance" }
florui-platform = { path = "../florui-platform" }
florui-fmt = { path = "../florui-fmt" }
clap = { version = "4.6.6", features = ["derive", "env"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
notify = "8.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
blake3 = "1"
winit = "0.30.13"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_System_LibraryLoader", "Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
