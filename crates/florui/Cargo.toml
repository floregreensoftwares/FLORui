[package]
name = "florui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "florui"

[features]
# Keeps each element's source location in a release build too, for profiling.
source-locations = []
# Records update traces in a release build too, for profiling.
profiling = ["florui-reactive/profiling"]

[dependencies]
florui-macros = { path = "../florui-macros" }
florui-reactive = { path = "../florui-reactive" }
