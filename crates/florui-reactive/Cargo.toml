[package]
name = "florui-reactive"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "florui_reactive"

[features]
# Counts live scopes, signals, refs and cleanups for test harnesses; see `live`.
live-counts = []
# Records update traces in a release build too (a debug build always does).
profiling = ["florui-profile/profiling"]

[dependencies]
florui-profile = { path = "../florui-profile" }
futures = "0.3.34"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "reactive"
harness = false
