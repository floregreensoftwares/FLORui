[package]
license.workspace = true
name = "florui-icon"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["decode"]
# Decoding pulls in florui-assets (and, transitively, resvg/image); a
# consumer that only needs the plain RawIcon type (e.g. a build-time-
# embedded icon's runtime side) shouldn't have to link any of it.
decode = ["dep:florui-assets", "dep:resvg", "dep:image"]

[dependencies]
# The actual parsing/decoding/rasterization implementation -- this crate
# no longer duplicates it. `resvg`/`image` stay direct dependencies too,
# only so their error types (`IconError::Svg`/`IconError::Png`) are
# nameable in this crate's own public error enum -- Rust's extern
# prelude only reaches a direct dependency's path, not a transitive one,
# even though `florui-assets` already depends on both for its own
# `AssetError`.
florui-assets = { path = "../florui-assets", optional = true }
resvg = { version = "0.48.1", default-features = false, optional = true }
image = { version = "0.25.10", default-features = false, features = [
    "png",
], optional = true }

[dev-dependencies]
syn = { version = "2", features = ["full"] }
tempfile = "3"
