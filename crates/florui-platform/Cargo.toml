[package]
name = "florui-platform"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "florui_platform"

[features]
default = ["desktop"]
# winit/softbuffer/notify/wgpu/pollster are only needed by the desktop
# host, not by the window-independent UiRuntime — a mobile or game host
# driving UiRuntime on its own shouldn't have to pull them in.
# `dep:windows-sys` is a no-op outside the Windows-only dependency table
# below — every other target simply never has it in its resolved graph.
desktop = ["dep:notify", "dep:softbuffer", "dep:winit", "dep:wgpu", "dep:pollster", "dep:windows-sys", "dep:windows", "dep:windows-core", "dep:florui-icon", "dep:serde", "dep:serde_json", "dep:arboard", "dep:accesskit", "dep:accesskit_winit"]

[dependencies]
florui = { path = "../florui" }
florui-assets = { path = "../florui-assets" }
florui-layout = { path = "../florui-layout" }
florui-paint = { path = "../florui-paint" }
florui-reactive = { path = "../florui-reactive" }
florui-style = { path = "../florui-style" }
florui-text = { path = "../florui-text" }
regex = "1.13.1"
# Only the plain `RawIcon` type -- decoding an actual SVG/PNG is the
# caller's own concern (see `florui_icon`'s own `decode` feature), so its
# `resvg`/`image` dependencies never enter this crate's graph.
florui-icon = { path = "../florui-icon", optional = true, default-features = false }
notify = { version = "8.2.0", optional = true }
softbuffer = { version = "0.4.8", optional = true }
taffy = "0.14"
winit = { version = "0.30.13", optional = true }
# `desktop`'s own real GPU presentation path (see `gpu`'s own module
# doc) — `softbuffer` stays the CPU fallback. Versions match
# `florui-devtools`'s own existing use of both, for one resolved version
# across the workspace.
wgpu = { version = "29.0.4", optional = true }
pollster = { version = "1.0.1", optional = true }
# `window_state`'s own persisted-file format -- versions match
# `florui-config`'s own pins, for one resolved version across the
# workspace.
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.151", optional = true }
# Real OS clipboard for text-input copy/cut/paste -- version matches what
# was already resolved transitively via `florui-devtools`'s own `egui`
# dependency, and scratchpad-validated (set/get round-trip) on this
# machine before being pinned here.
arboard = { version = "3.6.1", optional = true }
# Real accessibility bridge (roles/names/values/focus through the actual
# platform AT bridge) -- versions scratchpad-validated to build cleanly
# against this crate's own pinned `winit` before being pinned here;
# `accesskit_winit` pulls in real Windows UIA support (`accesskit_windows`).
accesskit = { version = "0.25", optional = true }
accesskit_winit = { version = "0.34", optional = true }

[dev-dependencies]
criterion = "0.5"
tempfile = "3"
florui-primitives = { path = "../florui-primitives" }
# Encoding a real PNG for `image.rs`'s own tests -- version matches
# `florui-assets`'s own pin, for one resolved version across the
# workspace.
image = { version = "0.25.10", default-features = false, features = ["png"] }

# `crate::os::windows`'s own dependency — real Win32 calls (DWM caption
# color, click-through, tray icon). Target-scoped so every other
# platform's dependency graph never has it at all, not merely unused.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    # `os::windows::single_instance`'s own dependency -- named mutex,
    # named pipe, and the security descriptor restricting it to the
    # current user session. `Win32_System_IO` is required transitively:
    # `ReadFile`/`WriteFile`/`ConnectNamedPipe` are feature-gated on it
    # in windows-sys because their signatures reference `OVERLAPPED`,
    # even though the functions themselves live under
    # `Storage::FileSystem`/`System::Pipes`.
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
] }
# `os::windows::file_dialog`'s own dependency -- `windows-sys` has no COM
# interface support at all (confirmed by grepping its generated source:
# no `IFileOpenDialog`/`IFileSaveDialog`/`IShellItem`, no `Interface`
# trait), so the modern Common Item Dialog needs this crate's COM-capable
# sibling instead. Not a new compilation unit in practice: `windows`
# 0.62.2 is already resolved here via `fontique`/`gpu-allocator`/
# `wgpu-hal`, all already in this crate's own dependency graph.
# `os::windows::drag_drop`'s own dependency additions: `Win32_System_Ole`
# (`IDropTarget`, `DROPEFFECT_*`, `RegisterDragDrop`/`RevokeDragDrop`,
# `OleInitialize`, and `CF_HDROP` -- confirmed to live here, not
# `Win32_UI_Shell` as might be assumed), `Win32_Graphics_Gdi`
# (`ScreenToClient` -- confirmed to live here, not
# `Win32_UI_WindowsAndMessaging`), `Win32_System_SystemServices`
# (`IDropTarget_Impl::DragEnter`'s own `MODIFIERKEYS_FLAGS` parameter type),
# and `Win32_System_Com_StructuredStorage` (required by this version for
# `IDataObject::GetData` itself, confirmed by its own `#[cfg(...)]` gate in
# the generated source) -- every one of these confirmed by grepping the
# pinned version's own generated source before assuming a feature name,
# not guessed.
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
# `#[windows::core::implement(...)]` (used by `os::windows::drag_drop`)
# expands to code referencing the literal crate path `windows_core::...`,
# which only resolves with `windows-core` as a direct dependency here --
# `windows::core` is merely a re-export, not the crate itself at the
# extern prelude. Pinned to the exact same version as `windows` above.
windows-core = { version = "0.62.2", optional = true }

[[bench]]
name = "runtime"
harness = false
