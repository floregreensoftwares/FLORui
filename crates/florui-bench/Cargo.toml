[package]
name = "florui-bench"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Reproducible performance baselines for the frame pipeline: isolated processes, cold and warm samples, and a comparison that separates a real change from noise."

[lib]
name = "florui_bench"

[[bin]]
name = "florui-bench"
path = "src/main.rs"

[features]
# Builds the benchmarked engine with the profiler available, to measure what it costs.
profiling = ["florui-platform/profiling", "florui-profile/profiling"]

[dependencies]
florui-profile = { path = "../florui-profile" }
florui = { path = "../florui" }
florui-platform = { path = "../florui-platform" }
florui-reactive = { path = "../florui-reactive" }
florui-style = { path = "../florui-style" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }

[dev-dependencies]
# Counts live scopes, signals and cleanups so the tests can check what an
# unmounted component released. Only the tests build it, since tracking every
# scope and signal would slow the workloads it is meant to leave alone.
florui-reactive = { path = "../florui-reactive", features = ["live-counts"] }

# Desktop duplication reports when the compositor presented a frame, which the
# edit-to-present measurement needs; the same version the platform crate uses.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Performance",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
