name: CI

on:
  push:
    branches: [bloom]
  pull_request:

jobs:
  # Three independent jobs instead of one sequential one -- lint, test, and
  # conformance don't depend on each other's output, and GitHub Actions
  # runs independent jobs on separate runners in parallel, so wall-clock
  # time drops to roughly the slowest of the three (test, the heaviest)
  # instead of their sum. Measured on a real run before this split:
  # test 10m39s, conformance 5m17s (plus its own chromium fetch), clippy
  # 3m53s, fmt+doctest+setup ~1m -- ~23m sequential total.
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo test --workspace --doc
      - name: Real-session tests (single-instance mutex, application-data folder)
        run: cargo test -p florui-platform -- --ignored

  conformance:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache pinned Chrome for Testing
        uses: actions/cache@v4
        with:
          path: .tools/chromium
          key: chromium-${{ hashFiles('crates/florui-conformance/chromium-pin.json') }}
      - name: Fetch pinned Chrome for Testing
        shell: pwsh
        run: ./scripts/fetch-chromium.ps1
      - name: Run Chromium-dependent conformance tests
        shell: pwsh
        run: |
          $pin = Get-Content -Raw crates/florui-conformance/chromium-pin.json | ConvertFrom-Json
          $chrome = Resolve-Path ".tools/chromium/$($pin.version)/chrome-win64/chrome.exe"
          $env:FLORUI_CHROMIUM_TEST = $chrome.Path
          cargo test -p florui-conformance -- --ignored


  # The same lint and tests on Linux, with the toolchain `rust-toolchain.toml`
  # pins. No Chromium conformance run and no benchmark here: both stay on
  # Windows. The window tests that need a real session are ignored, so no
  # display is needed.
  lint-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libxkbcommon-dev libwayland-dev libx11-dev libfontconfig-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p florui-assets -p florui-platform --features florui-assets/net,florui-platform/net --all-targets -- -D warnings

  # Without debug info the workspace's test binaries fit the runner's disk
  # (with it they come to about 30 GB).
  test-linux:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libxkbcommon-dev libwayland-dev libx11-dev libfontconfig-dev libasound2-dev libxkbcommon-x11-0 fonts-noto-color-emoji mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo test --workspace --doc
      # The network source is behind a feature that the workspace build leaves off.
      - run: cargo test -p florui-assets --features net
      - run: cargo test -p florui-platform --features net --lib

  # The Chromium-dependent tests on Linux, against the Linux build of the pinned
  # Chrome for Testing. Chromium cannot start its sandbox on the runner's
  # kernel, which the harness detects.
  conformance-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libxkbcommon-dev libwayland-dev libx11-dev libfontconfig-dev libasound2-dev libxkbcommon-x11-0 fonts-noto-color-emoji mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache pinned Chrome for Testing
        uses: actions/cache@v4
        with:
          path: .tools/chromium
          key: chromium-linux-${{ hashFiles('crates/florui-conformance/chromium-pin.json') }}
      - name: Fetch pinned Chrome for Testing
        run: bash scripts/fetch-chromium.sh
      - name: Run Chromium-dependent conformance tests
        run: |
          version=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' crates/florui-conformance/chromium-pin.json | head -1)
          export FLORUI_CHROMIUM_TEST="$PWD/.tools/chromium/$version/chrome-linux64/chrome"
          cargo test -p florui-conformance -- --ignored
