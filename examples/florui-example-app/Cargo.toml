[package]
name = "florui-example-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

# Read by `florui dev` (see florui-config's CargoProjectFacts) to know
# which example to build and run when invoked from anywhere inside this
# package with no --example override.
[package.metadata.florui.dev]
example = "counter"

[lib]
name = "florui_example_app"

[[bin]]
name = "florui-example-app"
path = "src/main.rs"

[dependencies]
florui = { path = "../../crates/florui" }
florui-reactive = { path = "../../crates/florui-reactive" }

[dev-dependencies]
florui-style = { path = "../../crates/florui-style" }
florui-text = { path = "../../crates/florui-text" }
florui-layout = { path = "../../crates/florui-layout" }
florui-paint = { path = "../../crates/florui-paint" }
florui-platform = { path = "../../crates/florui-platform" }
florui-test = { path = "../../crates/florui-test" }
florui-routing = { path = "../../crates/florui-routing" }
florui-devtools = { path = "../../crates/florui-devtools" }
florui-config = { path = "../../crates/florui-config" }
florui-icon = { path = "../../crates/florui-icon" }
taffy = "0.14"
winit = "0.30.13"
softbuffer = "0.4.8"
notify = "8.2.0"

[build-dependencies]
florui-build = { path = "../../crates/florui-build" }
florui-icon = { path = "../../crates/florui-icon" }
