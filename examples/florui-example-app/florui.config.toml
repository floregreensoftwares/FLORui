schema_version = 1

[app]
name = "florui-example-app"
identifier = "com.floregreen.florui-example-app"

[app.icons]
source = "assets/icons/app-icon.svg"

[app.activation]
single_instance = true
url_schemes = ["florui-demo"]
request_default = ["florui-demo", ".floruidemo"]

[[app.activation.file_associations]]
extension = "floruidemo"
description = "Florui single-instance demo document"
identity = "com.floregreen.florui-example-app.document"

[window.persistence]
enabled = true
