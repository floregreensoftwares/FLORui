[workspace]
resolver = "3"
members = [
    "crates/florui-devtools",
    "crates/florui-cli",
    "crates/florui-config",
    "crates/florui-assets",
    "crates/florui-icon",
    "crates/florui-primitives",
    "crates/florui-view-syntax",
    "crates/florui-macros",
    "crates/florui-fmt",
    "crates/florui",
    "crates/florui-conformance",
    "crates/florui-build",
    "crates/florui-style",
    "crates/florui-layout",
    "crates/florui-text",
    "crates/florui-paint",
    "crates/florui-platform",
    "crates/florui-test",
    "crates/florui-reactive",
    "crates/florui-routing",
    "examples/florui-example-app",
    "examples/florui-player",
]

[workspace.package]
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.94"

# A `dev` build otherwise runs these at opt-level 0 like everything
# else, and they're measurably the hot path for a real animation --
# rasterization, text shaping, CSS cascade, layout. Scoped to just these
# crates (not `[profile.dev.package."*"]`) so the dozens of other
# dependencies that never show up in that path don't pay for a cold
# build they don't need; florui's own crates stay at opt-level 0 for a
# fast edit-compile loop.
[profile.dev.package.tiny-skia]
opt-level = 2
[profile.dev.package.tiny-skia-path]
opt-level = 2
[profile.dev.package.skrifa]
opt-level = 2
[profile.dev.package.harfrust]
opt-level = 2
[profile.dev.package.stylo]
opt-level = 2
[profile.dev.package.taffy]
opt-level = 2
