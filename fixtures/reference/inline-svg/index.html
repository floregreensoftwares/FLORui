<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../assets/reset.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="el" class="wrap">
    <svg height="60" width="100" class="s p0">
      <rect y="0" fill="#d05040" width="60" height="60" x="0"></rect>
      <circle fill="#4070d0" cx="70" fill-opacity="0.7" cy="30" r="24"></circle>
    </svg>
    <svg viewBox="0 0 50 50" height="60" width="100" class="s p1">
      <rect y="0" fill="#40a060" width="50" height="50" x="0"></rect>
      <path d="M5 45 L25 5 L45 45 Z" fill="#ffffff"></path>
    </svg>
    <svg viewBox="0 0 100 60" height="60" width="100" class="s p2">
      <rect rx="10" class="k" y="5" height="50" x="5" width="90"></rect>
      <circle fill="currentColor" cx="50" cy="30" r="14"></circle>
    </svg>
    <svg height="60" width="100" class="s p3">
      <defs>
        <linearGradient x1="0" x2="1" y1="0" id="gr" y2="0">
          <stop offset="0" stop-color="#e0b030"></stop>
          <stop offset="1" stop-color="#a050c0"></stop>
        </linearGradient>
      </defs>
      <rect y="0" fill="url(#gr)" width="100" height="60" x="0"></rect>
    </svg>
    <svg height="60" width="100" class="s p4">
      <text y="42" font-size="36" fill="#202020" x="6">Hi!</text>
    </svg>
    <svg height="60" style="overflow:hidden" width="100" class="s p5">
      <rect y="-20" fill="#30a0b0" width="70" height="50" x="-20"></rect>
      <circle fill="#d05040" cx="100" cy="60" r="30"></circle>
    </svg>
    <svg class="s p6" viewBox="0 0 100 60">
      <rect y="0" fill="#a050c0" width="100" height="60" x="0"></rect>
      <rect y="10" fill="#ffffff" width="30" height="40" x="10"></rect>
    </svg>
    <svg viewBox="0 0 20 20" height="60" preserveAspectRatio="xMinYMin slice" width="100" class="s p7">
      <rect y="0" fill="#e0b030" width="20" height="20" x="0"></rect>
      <circle fill="#4070d0" cx="10" cy="10" r="6"></circle>
    </svg>
    <svg height="60" width="100" class="s p8">
      <rect class="r8" fill="#d05040" y="10" height="30" x="10" width="30"></rect>
    </svg>
    <svg height="60" width="100" class="s p9">
      <rect class="r9" fill="#40a060" y="5" height="20" x="5" width="20"></rect>
      <rect transform="rotate(45 75 25)" y="10" width="30" stroke-width="4" fill="none" height="30" x="60" stroke="#2a3a58"></rect>
    </svg>
    <svg viewBox="0 0 50 30" height="60" width="100" class="s p10">
      <rect class="r10" fill="#a050c0" y="4" height="10" x="4" width="12"></rect>
    </svg>
  </div>
</body>
</html>
