<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../assets/reset.css">

<body>
  <div id="el" class="wrap">

        <div class="t">Another name here</div>

        <div class="b w40 h14"></div>

        <div class="b w20 h24"></div>
        <div class="f w20 h14"></div>
