<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../assets/reset.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="el" class="wrap">
    <div class="b solid pos-solid"></div>
    <div class="b neg pos-neg"></div>
    <div class="b radius pos-radius"></div>
    <div class="b dashed pos-dashed"></div>
    <div class="b double pos-double"></div>
    <div class="b groove pos-groove"></div>
    <div class="b dotted-r pos-dotted-r"></div>
    <div class="b auto pos-auto"></div>
    <div class="b auto-r pos-auto-r"></div>
    <div class="b thick pos-thick"></div>
    <div class="b inset-off pos-inset-off"></div>
    <p class="line line1">before <span class="mark">inline outlined</span> after</p>
    <p class="line line2"><span class="mark">wrapped inline outlined text here</span> <span class="autom">link</span></p>
    <p class="line line3"><span class="markd">wrapped dashed outlined text here</span></p>
    <p class="line line4"><span class="markdbl">wrapped double outlined text</span></p>
  </div>
</body>
</html>
