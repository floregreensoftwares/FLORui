<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../assets/reset.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="el" class="wrap">
    <table class="wide">
      <tr>
        <td>
          <div class="d w20"></div>
        </td>
        <td>
          <div class="d w80"></div>
        </td>
      </tr>
      <tr>
        <td>
          <div class="d w40"></div>
        </td>
        <td class="pct">
          <div class="d w20"></div>
        </td>
      </tr>
    </table>
    <table>
      <tr class="row">
        <td rowspan="2">
          <div class="d w40 h50"></div>
        </td>
        <td colspan="2">
          <div class="d w80"></div>
        </td>
      </tr>
      <tr class="row">
        <td>
          <div class="d w20"></div>
        </td>
        <td>
          <div class="d w40"></div>
        </td>
      </tr>
    </table>
    <table>
      <tr>
        <td class="vt">
          <div class="d w20"></div>
        </td>
        <td>
          <div class="d w20"></div>
        </td>
        <td class="vb">
          <div class="d w20"></div>
        </td>
        <td>
          <div class="d w20 h50 g"></div>
        </td>
      </tr>
    </table>
    <table class="fixed">
      <tr>
        <td class="c60">
          <div class="d w20"></div>
        </td>
        <td>
          <div class="d w80"></div>
        </td>
        <td>
          <div class="d w20"></div>
        </td>
      </tr>
      <tr>
        <td>
          <div class="d w20"></div>
        </td>
        <td class="w80">
          <div class="d w20"></div>
        </td>
        <td>
          <div class="d w20"></div>
        </td>
      </tr>
    </table>
    <table class="border spaced">
      <caption class="cap">
        <div class="d w40 y"></div>
      </caption>
      <tr>
        <td>
          <div class="d w20"></div>
        </td>
        <td>
          <div class="d w20"></div>
        </td>
      </tr>
    </table>
    <table class="border">
      <caption class="cap cb">
        <div class="d w80 y"></div>
      </caption>
      <tr>
        <td>
          <div class="d w20"></div>
        </td>
      </tr>
    </table>
    <table>
      <colgroup class="cg">
        <col class="cw50"></col>
        <col class="cw30"></col>
      </colgroup>
      <tfoot>
        <tr>
          <td>
            <div class="d w20 v"></div>
          </td>
        </tr>
      </tfoot>
      <tbody>
        <tr>
          <td>
            <div class="d w20"></div>
          </td>
          <td>
            <div class="d w20"></div>
          </td>
        </tr>
      </tbody>
      <thead>
        <tr>
          <td>
            <div class="d w20 y"></div>
          </td>
        </tr>
      </thead>
    </table>
    <table class="hide">
      <tr>
        <td>
          <div class="d w20"></div>
        </td>
        <td></td>
      </tr>
    </table>
    <table>
      <tr>
        <td>
          <table>
            <tr>
              <td>
                <div class="d w20"></div>
              </td>
              <td>
                <div class="d w20 g"></div>
              </td>
            </tr>
          </table>
        </td>
        <td>
          <div class="d w20"></div>
        </td>
      </tr>
    </table>
  </div>
</body>
</html>
